name: go-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/engine-wasm/go.mod
          cache-dependency-path: packages/engine-wasm/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: packages/engine-wasm

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
        working-directory: packages/engine-wasm

      - name: Coverage summary
        run: |
          {
            echo "### Go coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: packages/engine-wasm

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: packages/engine-wasm/coverage.out

      # The PSD fixture writer harness re-exports every fixture into _dump/ so the
      # bytes Agogo writes can be opened by a reader that is not Agogo's own.
      # That check cannot run here (it needs psd-tools), so publish the files and
      # let a reviewer run `just fixtures-verify` or open them in Photoshop.
      - name: Upload re-exported PSD fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psd-fixture-reexports
          path: packages/engine-wasm/internal/io/psdfixture/_dump
          if-no-files-found: ignore
