name: go-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/engine-wasm/go.mod
          cache-dependency-path: packages/engine-wasm/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: packages/engine-wasm

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
        working-directory: packages/engine-wasm

      - name: Coverage summary
        run: |
          {
            echo "### Go coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: packages/engine-wasm

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: packages/engine-wasm/coverage.out

      # The PSD fixture writer harness re-exports every fixture into _dump/ so the
      # bytes Agogo writes can be opened by a reader that is not Agogo's own.
      # That check cannot run here (it needs psd-tools), so publish the files and
      # let a reviewer run `just fixtures-verify` or open them in Photoshop.
      - name: Upload re-exported PSD fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psd-fixture-reexports
          path: packages/engine-wasm/internal/io/psdfixture/_dump
          if-no-files-found: ignore

  # A short mutation pass over the PSD parser fuzz targets. The `go test` job
  # above already EXECUTES every seed (synthetic plus the whole fixture corpus)
  # under -race; this job is the part that generates new inputs.
  #
  # It is a separate job so it runs in parallel with the coverage run rather
  # than adding its ~3 minutes to that job's critical path.
  #
  # -race is deliberately NOT used here: race-instrumented fuzzing runs about
  # 20x fewer executions per second, and a local trial aborted with a spurious
  # "context deadline exceeded" while gathering baseline coverage. Race
  # coverage of these code paths comes from the seed execution in the job above.
  #
  # 30s per target is the smallest budget that reaches well past the seed
  # corpus: locally that is ~0.9M-2M executions for the byte-level targets and
  # ~200k for whole-file FuzzParse. `go test -fuzz` accepts exactly one target
  # per invocation, hence one step each.
  #
  # READING A RED RUN: this job can fail WITHOUT having found anything. A
  # target that ends with
  #
  #     --- FAIL: FuzzParseLayerExtraData (30.09s)
  #         context deadline exceeded
  #
  # and no "Failing input written to testdata/fuzz/..." line is the coordinator
  # timing out while shutting its workers down, not a crasher — the same
  # spurious error noted above for -race, which also shows up here when the
  # runner is loaded. Observed 2026-09-18: 1.6M execs at ~51k/s where the same
  # target does ~96k/s locally, and the identical commit passed on re-run.
  #
  # So before assuming a regression, check for the artifact: a real finding
  # uploads `psd-fuzz-crashers` and names the failing input. If there is no
  # artifact, re-run the job. Deliberately NOT retried automatically — a target
  # that started timing out because an input became genuinely slow is a finding
  # worth seeing, and an automatic retry would bury it.
  go-fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/engine-wasm/go.mod
          cache-dependency-path: packages/engine-wasm/go.sum

      - name: Fuzz Parse
        run: go test -run '^$' -fuzz '^FuzzParse$' -fuzztime=30s ./internal/io/psd/
        working-directory: packages/engine-wasm

      - name: Fuzz DecodePackBits
        run: go test -run '^$' -fuzz '^FuzzDecodePackBits$' -fuzztime=30s ./internal/io/psd/
        working-directory: packages/engine-wasm

      - name: Fuzz ParseLayerAndMaskInfo
        run: go test -run '^$' -fuzz '^FuzzParseLayerAndMaskInfo$' -fuzztime=30s ./internal/io/psd/
        working-directory: packages/engine-wasm

      - name: Fuzz ParseLayerExtraData
        run: go test -run '^$' -fuzz '^FuzzParseLayerExtraData$' -fuzztime=30s ./internal/io/psd/
        working-directory: packages/engine-wasm

      - name: Fuzz ParseCompositeImageData
        run: go test -run '^$' -fuzz '^FuzzParseCompositeImageData$' -fuzztime=30s ./internal/io/psd/
        working-directory: packages/engine-wasm

      - name: Fuzz ParseTextLayerMetadata
        run: go test -run '^$' -fuzz '^FuzzParseTextLayerMetadata$' -fuzztime=30s ./internal/io/psd/
        working-directory: packages/engine-wasm

      - name: Fuzz ParseAdjustmentBlock
        run: go test -run '^$' -fuzz '^FuzzParseAdjustmentBlock$' -fuzztime=30s ./internal/io/psd/
        working-directory: packages/engine-wasm

      - name: Fuzz descriptor Parse
        run: go test -run '^$' -fuzz '^FuzzParse$' -fuzztime=30s ./internal/io/descriptor/
        working-directory: packages/engine-wasm

      # A crasher is written to testdata/fuzz/<Target>/ next to the package.
      # Publish it so it can be checked in verbatim rather than reconstructed
      # from the log.
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: psd-fuzz-crashers
          path: packages/engine-wasm/internal/io/psd/testdata/fuzz
          if-no-files-found: ignore
