name: go-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/engine-wasm/go.mod
          cache-dependency-path: packages/engine-wasm/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: packages/engine-wasm

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
        working-directory: packages/engine-wasm

      - name: Coverage summary
        run: |
          {
            echo "### Go coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: packages/engine-wasm

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: packages/engine-wasm/coverage.out
